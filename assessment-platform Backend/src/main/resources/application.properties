# =============================================================
# Application Configuration – Online Assessment Platform
# =============================================================
# IMPORTANT: Do NOT hard-code credentials here.
# Set the environment variables listed below before running.
#
# Windows PowerShell example:
#   $env:DB_URL      = "jdbc:mysql://localhost:3306/assessment_system?..."
#   $env:DB_USERNAME = "root"
#   $env:DB_PASSWORD = "your_password"
#   $env:JWT_SECRET  = "your-256-bit-secret-key-at-least-32-chars"
# =============================================================

# ── Server ─────────────────────────────────────────────────
server.port=${PORT:8080}

# ── DataSource ─────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/assessment_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rakmo@5191}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP – Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ────────────────────────────────────────
# update: Automatically creates or updates tables in the database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Disable open-in-view to prevent lazy-load queries during response serialization
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Dialect is auto-detected by Hibernate 6 — no need to set it explicitly

# ── JWT ────────────────────────────────────────────────────
# Secret must be at least 256 bits (32 characters) for HS256.
# Expiration is in milliseconds: 86400000 = 24 hours.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# ── CORS ───────────────────────────────────────────────────
# React dev server origin. Override in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Logging ────────────────────────────────────────────────
logging.level.com.assessment=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
